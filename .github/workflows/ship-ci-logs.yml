# Example: ship this workflow's own job logs to AgentScope after every run.
# Copy into any repo's .github/workflows/, set AGENTSCOPE_URL / AGENTSCOPE_API_KEY
# secrets, then uncomment the workflow_run trigger. Manual trigger only by default.
name: Ship CI logs to AgentScope

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID whose logs to ship"
        required: true
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions: { actions: read }
    env:
      RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name || 'manual' }}
    steps:
      - name: Download job logs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/logs" > logs.zip
          unzip -o -q logs.zip -d logs
          find logs -name '*.txt' -exec cat {} + > all.txt
      - name: POST to ingestion API
        run: |
          test -n "${{ secrets.AGENTSCOPE_URL }}" || { echo "AGENTSCOPE_URL secret not set"; exit 1; }
          curl -sS -X POST "${{ secrets.AGENTSCOPE_URL }}/v1/ingest/bulk?source_type=cicd&service=ci-${RUN_NAME}" \
            -H "X-Api-Key: ${{ secrets.AGENTSCOPE_API_KEY }}" -H "Content-Type: text/plain" \
            --data-binary @all.txt
