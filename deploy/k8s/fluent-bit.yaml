# Fluent Bit DaemonSet: ships every container's stdout/stderr on every node to
# the ingestion API with Kubernetes metadata attached (namespace, pod, labels).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentscope-fluent-bit
rules:
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentscope-fluent-bit
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agentscope-fluent-bit }
subjects:
  - { kind: ServiceAccount, name: fluent-bit, namespace: agentscope }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Port     2020
        storage.path  /var/log/flb-storage/
        storage.sync  normal
        storage.max_chunks_up 128

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        Mem_Buf_Limit     64MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        Keep_Log            On
        Labels              On
        Annotations         Off

    [FILTER]
        Name    modify
        Match   kube.*
        Add     source_type kubernetes

    [OUTPUT]
        Name              http
        Match             kube.*
        Host              ingestion-api
        Port              8081
        URI               /v1/ingest/kubernetes
        Format            json
        Json_date_key     timestamp
        Json_date_format  iso8601
        Header            X-Api-Key ${INGEST_API_KEY}
        Retry_Limit       10
        compress          gzip
        workers           2
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
spec:
  selector: { matchLabels: { app: fluent-bit } }
  template:
    metadata: { labels: { app: fluent-bit } }
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - { operator: Exists }
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.0
          env:
            - name: INGEST_API_KEY
              valueFrom: { secretKeyRef: { name: agentscope-secrets, key: INGEST_API_KEY } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: config, mountPath: /fluent-bit/etc/ }
            - { name: storage, mountPath: /var/log/flb-storage }
      volumes:
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: containers, hostPath: { path: /var/lib/docker/containers } }
        - { name: config, configMap: { name: fluent-bit-config } }
        - { name: storage, emptyDir: {} }
