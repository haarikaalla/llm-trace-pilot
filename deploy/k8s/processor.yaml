# Stream processor: scale replicas up to the partition count of logs.raw (12).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  replicas: 3
  selector: { matchLabels: { app: processor } }
  template:
    metadata: { labels: { app: processor } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: processor
          image: agentscope
          env: [ { name: SERVICE_ROLE, value: processor } ]
          envFrom:
            - configMapRef: { name: agentscope-config }
            - secretRef: { name: agentscope-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [ { name: data, mountPath: /data }, { name: tmp, mountPath: /tmp } ]
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
# Scale on consumer lag when KEDA is installed (kubectl apply -f https://github.com/kedacore/keda/releases/...).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: processor-lag
spec:
  scaleTargetRef: { name: processor }
  minReplicaCount: 3
  maxReplicaCount: 12
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: agentscope-logs.raw
        topic: logs.raw
        lagThreshold: "5000"
