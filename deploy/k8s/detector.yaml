# Detector + RCA + AI summaries. Single replica (stateless between runs; the
# incident repository lives on the shared PVC). Run 2+ with service sharding if needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscope-state
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: detector } }
  template:
    metadata: { labels: { app: detector } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: detector
          image: agentscope
          env: [ { name: SERVICE_ROLE, value: detector } ]
          envFrom:
            - configMapRef: { name: agentscope-config }
            - secretRef: { name: agentscope-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [ { name: state, mountPath: /data }, { name: tmp, mountPath: /tmp } ]
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: agentscope-state } }
        - { name: tmp, emptyDir: {} }
