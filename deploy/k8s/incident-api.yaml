apiVersion: v1
kind: Service
metadata:
  name: incident-api
spec:
  selector: { app: incident-api }
  ports: [ { name: http, port: 8082, targetPort: 8082 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
spec:
  replicas: 1
  strategy: { type: Recreate }   # shares the SQLite state volume with the detector
  selector: { matchLabels: { app: incident-api } }
  template:
    metadata: { labels: { app: incident-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: agentscope
          env:
            - { name: SERVICE_ROLE, value: incident-api }
            - { name: PORT, value: "8082" }
          envFrom:
            - configMapRef: { name: agentscope-config }
            - secretRef: { name: agentscope-secrets }
          ports: [ { containerPort: 8082 } ]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [ { name: state, mountPath: /data }, { name: tmp, mountPath: /tmp } ]
          livenessProbe:  { httpGet: { path: /healthz, port: 8082 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 8082 }, periodSeconds: 10 }
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: agentscope-state } }
        - { name: tmp, emptyDir: {} }
