apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentscope
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - kafka.yaml
  - opensearch.yaml
  - ingestion-api.yaml
  - processor.yaml
  - detector.yaml
  - incident-api.yaml
  - dashboard.yaml
  - fluent-bit.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: agentscope
    newName: ghcr.io/haarikaalla/agentscope
    newTag: "2.0.0"
commonLabels:
  app.kubernetes.io/part-of: agentscope
