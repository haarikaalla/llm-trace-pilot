<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1016"/><stop offset="1" stop-color="#15161e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6aff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8ab0"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5f5f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .zone  { fill: rgba(255,255,255,0.025); stroke: #2a2a36; stroke-width: 1; rx: 14; }
      .zoneT { fill: #6f6f9a; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
      .box   { fill: #1c1c24; stroke: #33334a; stroke-width: 1.2; rx: 10; filter: url(#shadow); }
      .boxA  { fill: #1c1c24; stroke: #7c6aff; stroke-width: 1.6; rx: 10; filter: url(#shadow); }
      .boxS  { fill: #16161d; stroke: #3a3a52; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 10; }
      .t     { fill: #ececf6; font-size: 14px; font-weight: 600; }
      .s     { fill: #8f8fb4; font-size: 11px; }
      .k     { fill: #a78bfa; font-size: 10px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .flow  { stroke: #8a8ab0; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flowD { stroke: #8a8ab0; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .flowR { stroke: #ff5f5f; stroke-width: 1.6; fill: none; marker-end: url(#arrowRed); }
      .lbl   { fill: #c4c4dd; font-size: 10.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .pill  { fill: rgba(124,106,255,.14); stroke: rgba(124,106,255,.35); rx: 10; }
      .pillT { fill: #c9bfff; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="44" fill="#ffffff" font-size="22" font-weight="700">AgentScope — AI-Powered Observability &amp; Incident Intelligence</text>
  <text x="40" y="66" class="s" font-size="12.5">Reference architecture · logs in, explained incidents out · same code path on a laptop (memory + SQLite) and in production (Kafka + OpenSearch)</text>
  <rect x="40" y="78" width="420" height="4" fill="url(#accent)" rx="2"/>

  <!-- ───────── ZONE 1: SOURCES ───────── -->
  <rect x="40" y="110" width="230" height="590" class="zone"/>
  <text x="60" y="134" class="zoneT">1 · LOG SOURCES</text>

  <rect x="60" y="156" width="190" height="78" class="box"/>
  <text x="76" y="182" class="t">Application</text>
  <text x="76" y="200" class="s">JSON · logfmt · plain text</text>
  <text x="76" y="216" class="s">any language, any logger</text>

  <rect x="60" y="250" width="190" height="78" class="box"/>
  <text x="76" y="276" class="t">Kubernetes</text>
  <text x="76" y="294" class="s">Fluent Bit DaemonSet → CRI logs</text>
  <text x="76" y="310" class="s">namespace · pod · labels · node</text>

  <rect x="60" y="344" width="190" height="78" class="box"/>
  <text x="76" y="370" class="t">Infrastructure</text>
  <text x="76" y="388" class="s">syslog 3164/5424 · journald</text>
  <text x="76" y="404" class="s">nginx / ALB access logs</text>

  <rect x="60" y="438" width="190" height="78" class="box"/>
  <text x="76" y="464" class="t">CI / CD</text>
  <text x="76" y="482" class="s">GitHub Actions · GitLab · Jenkins</text>
  <text x="76" y="498" class="s">build · test · deploy stages</text>

  <rect x="60" y="532" width="190" height="78" class="boxA"/>
  <text x="76" y="558" class="t">LLM Agents</text>
  <text x="76" y="576" class="s">@trace calls become llm.* services</text>
  <text x="76" y="592" class="s">tokens · cost · latency · errors</text>

  <text x="60" y="660" class="s">Millions of events / day</text>
  <text x="60" y="676" class="s">HTTP · NDJSON · webhooks</text>

  <!-- ───────── ZONE 2: INGEST + STREAM ───────── -->
  <rect x="300" y="110" width="250" height="590" class="zone"/>
  <text x="320" y="134" class="zoneT">2 · INGEST &amp; STREAM</text>

  <rect x="320" y="200" width="210" height="104" class="box"/>
  <text x="336" y="226" class="t">ingestion-api</text>
  <text x="336" y="244" class="s">FastAPI · O(1) validation</text>
  <text x="336" y="260" class="s">API-key auth · size limits</text>
  <text x="336" y="276" class="s">HPA 3 → 30 replicas · PDB</text>
  <text x="336" y="293" class="k">/v1/ingest · /bulk · /kubernetes · /cicd</text>

  <rect x="320" y="372" width="210" height="150" class="box" style="stroke:#e0a400;"/>
  <text x="336" y="398" class="t">Apache Kafka</text>
  <text x="336" y="416" class="s">KRaft · 12 partitions · RF 3</text>
  <text x="336" y="432" class="s">keyed by service → ordered bursts</text>
  <text x="336" y="448" class="s">acks=all · gzip · at-least-once</text>
  <text x="336" y="472" class="k">logs.raw</text>
  <text x="336" y="488" class="k">logs.processed</text>
  <text x="336" y="504" class="k">anomalies · alerts · incidents · dlq</text>

  <!-- ───────── ZONE 3: PROCESS + STORE ───────── -->
  <rect x="580" y="110" width="260" height="590" class="zone"/>
  <text x="600" y="134" class="zoneT">3 · PROCESS &amp; INDEX</text>

  <rect x="600" y="156" width="220" height="196" class="box"/>
  <text x="616" y="182" class="t">processor-worker ×N</text>
  <text x="616" y="200" class="s">KEDA-scaled on consumer lag</text>
  <rect x="616" y="214" width="188" height="22" class="pill"/><text x="626" y="229" class="pillT">① CLEAN  ansi · ctrl · dedupe ws</text>
  <rect x="616" y="242" width="188" height="22" class="pill"/><text x="626" y="257" class="pillT">② PARSE  per-source grammars</text>
  <rect x="616" y="270" width="188" height="22" class="pill"/><text x="626" y="285" class="pillT">③ NORMALIZE  ts · severity · svc</text>
  <rect x="616" y="298" width="188" height="22" class="pill"/><text x="626" y="313" class="pillT">④ ENRICH  PII · template · class</text>
  <text x="616" y="340" class="s">fingerprint · error class · severity score</text>

  <rect x="600" y="400" width="220" height="122" class="box" style="stroke:#1e88e5;"/>
  <text x="616" y="426" class="t">OpenSearch</text>
  <text x="616" y="444" class="s">daily indices · index template</text>
  <text x="616" y="460" class="s">bulk 1000 · refresh 5s · compression</text>
  <text x="616" y="476" class="s">date_histogram · scan · search</text>
  <text x="616" y="500" class="k">logs-YYYY.MM.DD   (SQLite locally)</text>

  <rect x="600" y="560" width="220" height="80" class="box"/>
  <text x="616" y="586" class="t">Incident Store</text>
  <text x="616" y="604" class="s">anomalies · incidents · alerts</text>
  <text x="616" y="620" class="s">dependency edges · signatures</text>

  <!-- ───────── ZONE 4: INTELLIGENCE ───────── -->
  <rect x="870" y="110" width="250" height="590" class="zone"/>
  <text x="890" y="134" class="zoneT">4 · INTELLIGENCE</text>

  <rect x="890" y="156" width="210" height="150" class="boxA"/>
  <text x="906" y="182" class="t">ML Detection</text>
  <text x="906" y="200" class="s">per service · 60 s windows · 30 baseline</text>
  <text x="906" y="220" class="k">error spike      Poisson + rate</text>
  <text x="906" y="236" class="k">degradation      CUSUM p95 · composite</text>
  <text x="906" y="252" class="k">volume           robust-z ⊕ EWMA</text>
  <text x="906" y="268" class="k">patterns         novel · burst</text>
  <text x="906" y="284" class="k">prediction       logistic (fit-able)</text>
  <text x="906" y="300" class="s">explainable 0–1 scores · no GPU</text>

  <rect x="890" y="326" width="210" height="130" class="boxA"/>
  <text x="906" y="352" class="t">Root-Cause Analysis</text>
  <text x="906" y="372" class="k">correlation   who errored first · traces</text>
  <text x="906" y="388" class="k">dependency    learned graph · blast radius</text>
  <text x="906" y="404" class="k">history       signature similarity</text>
  <text x="906" y="428" class="s">ranks origin: failing service whose</text>
  <text x="906" y="444" class="s">dependencies are healthy</text>

  <rect x="890" y="476" width="210" height="104" class="boxA"/>
  <text x="906" y="502" class="t">AI Incident Summary</text>
  <text x="906" y="520" class="s">Ollama (local LLM) · JSON mode</text>
  <text x="906" y="536" class="s">deterministic fallback — always on</text>
  <text x="906" y="556" class="k">what happened · impacted services</text>
  <text x="906" y="572" class="k">root causes · remediation actions</text>

  <rect x="890" y="600" width="210" height="80" class="box"/>
  <text x="906" y="626" class="t">Alert Manager</text>
  <text x="906" y="644" class="s">rules · dedup · incident grouping</text>
  <text x="906" y="660" class="s">topology merge · auto-resolve</text>

  <!-- ───────── ZONE 5: CONSUMERS ───────── -->
  <rect x="1150" y="110" width="210" height="590" class="zone"/>
  <text x="1170" y="134" class="zoneT">5 · ACT &amp; OBSERVE</text>

  <rect x="1170" y="156" width="170" height="150" class="box"/>
  <text x="1186" y="182" class="t">Dashboard</text>
  <text x="1186" y="202" class="s">system health</text>
  <text x="1186" y="218" class="s">error trends</text>
  <text x="1186" y="234" class="s">anomaly scores</text>
  <text x="1186" y="250" class="s">incident timeline</text>
  <text x="1186" y="266" class="s">dependency graph</text>
  <text x="1186" y="288" class="k">SSE live feed</text>

  <rect x="1170" y="326" width="170" height="90" class="box"/>
  <text x="1186" y="352" class="t">incident-api</text>
  <text x="1186" y="372" class="k">/api/obs/incidents</text>
  <text x="1186" y="388" class="k">/api/obs/health · /trends</text>
  <text x="1186" y="404" class="k">/api/obs/dependencies</text>

  <rect x="1170" y="436" width="170" height="76" class="box"/>
  <text x="1186" y="462" class="t">On-call</text>
  <text x="1186" y="480" class="s">Slack · PagerDuty · webhook</text>
  <text x="1186" y="496" class="s">Alertmanager-compatible</text>

  <rect x="1170" y="532" width="170" height="76" class="boxS"/>
  <text x="1186" y="558" class="t">Prometheus</text>
  <text x="1186" y="576" class="s">/metrics · consumer lag</text>
  <text x="1186" y="592" class="s">/healthz · /readyz</text>

  <!-- ───────── FLOWS ───────── -->
  <!-- sources -> ingestion -->
  <path class="flow" d="M250 195 C 285 195, 285 240, 318 240"/>
  <path class="flow" d="M250 289 C 285 289, 285 252, 318 252"/>
  <path class="flow" d="M250 383 C 285 383, 285 264, 318 264"/>
  <path class="flow" d="M250 477 C 285 477, 285 276, 318 276"/>
  <!-- llm bridge -> processor (bypasses parse) -->
  <path class="flowD" d="M250 571 C 560 571, 560 330, 598 330"/>
  <text x="400" y="560" class="lbl">tracer bridge · normalized events</text>

  <!-- ingestion -> kafka -->
  <path class="flow" d="M425 304 L 425 370"/>
  <text x="434" y="342" class="lbl">logs.raw</text>

  <!-- kafka -> processor -->
  <path class="flow" d="M530 440 C 565 440, 565 254, 598 254"/>
  <!-- processor -> kafka processed (back) -->
  <path class="flowD" d="M598 300 C 575 300, 575 470, 532 470"/>
  <text x="548" y="492" class="lbl" text-anchor="end">processed</text>

  <!-- processor -> opensearch -->
  <path class="flow" d="M710 352 L 710 398"/>
  <text x="718" y="380" class="lbl">bulk index</text>

  <!-- opensearch -> ML -->
  <path class="flow" d="M820 440 C 855 440, 855 230, 888 230"/>
  <text x="834" y="320" class="lbl">windows</text>

  <!-- ML -> RCA -> Summary -> Alerts (vertical chain) -->
  <path class="flow" d="M995 306 L 995 324"/>
  <path class="flow" d="M995 456 L 995 474"/>
  <path class="flow" d="M995 580 L 995 598"/>

  <!-- intelligence -> incident store -->
  <path class="flow" d="M888 640 C 860 640, 860 600, 822 600"/>
  <text x="846" y="588" class="lbl" text-anchor="end">persist</text>

  <!-- alerts -> on-call (red) -->
  <path class="flowR" d="M1100 640 C 1135 640, 1135 474, 1168 474"/>
  <text x="1112" y="562" class="lbl" fill="#ff8c8c">alerts</text>

  <!-- store + opensearch -> incident-api -> dashboard -->
  <path class="flow" d="M820 600 C 1140 600, 1140 390, 1168 390"/>
  <path class="flow" d="M1255 326 L 1255 308"/>
  <text x="1262" y="320" class="lbl">read model</text>

  <!-- alerts -> kafka topics (dashed back) -->
  <path class="flowD" d="M890 660 C 700 700, 500 700, 430 524"/>
  <text x="640" y="716" class="lbl">anomalies · alerts · incidents topics</text>

  <!-- ───────── FOOTER: deployment + guarantees ───────── -->
  <rect x="40" y="722" width="1320" height="72" class="zone"/>
  <text x="60" y="746" class="zoneT">DEPLOYMENT &amp; GUARANTEES</text>
  <text x="60" y="770" class="s">Docker (one image, SERVICE_ROLE entrypoint) · Docker Compose · Kubernetes Kustomize · HPA + KEDA · Fluent Bit DaemonSet · NetworkPolicy default-deny · non-root, read-only FS</text>
  <text x="60" y="786" class="s">At-least-once delivery + idempotent indexing (event_id) · dead-letter queue · PII/secret redaction by default · pluggable ports: EventBus · LogIndex · IncidentRepository · Notifier</text>

  <text x="1360" y="810" class="s" text-anchor="end" font-size="10">agentscope v2.0 · MIT</text>
</svg>
